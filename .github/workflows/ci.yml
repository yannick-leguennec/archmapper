name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    env:
      # Placeholder values so the eager config loader (src/config.ts loads
      # dotenv at import time) does not fail before any test runs. The full
      # test suite mocks the Anthropic client; no real API calls are made.
      ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
      PROJECT_NAME: ci_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
